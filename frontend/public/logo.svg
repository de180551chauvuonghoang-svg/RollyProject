  <path d="M22 17C22 16.4477 22.4477 16 23 16H31C34.866 16 38 19.134 38 23C38 26.2323 35.808 28.9525 32.8122 29.7458L38.6 39.026C38.878 39.4708 38.5584 40 38.0366 40H34.2678C33.8643 40 33.4913 39.7826 33.2952 39.4334L27.75 30H25.5V39C25.5 39.5523 25.0523 40 24.5 40H23C22.4477 40 22 39.5523 22 39V17Z" fill="url(#goldGrad)"/>
  
  <!-- Counter of R -->
