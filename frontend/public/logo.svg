  <text x="66" y="34" font-family="'Playfair Display', serif, Georgia" font-size="24" font-weight="700" fill="#0F172A" letter-spacing="-0.5">Rolly</text>
  <text x="130" y="34" font-family="'Playfair Display', serif, Georgia" font-size="20" font-weight="300" fill="#A67C1E" letter-spacing="0.5">Academy</text>
  <text x="67" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#8C6005" letter-spacing="2.2">HOSPITALITY EXCELLENCE SUITE</text>
