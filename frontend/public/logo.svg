      <stop offset="50%" stop-color="#F8ECCB"/>
      <stop offset="100%" stop-color="#E9CE8B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
