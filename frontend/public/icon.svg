<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="50%" stop-color="#FBF4E4" />
      <stop offset="100%" stop-color="#F3E5C4" />
    </linearGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A" />
      <stop offset="50%" stop-color="#C69214" />
      <stop offset="100%" stop-color="#936806" />
    </linearGradient>

    <!-- Gold Letter Gradient -->
    <linearGradient id="goldLetter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C69214" />
      <stop offset="100%" stop-color="#8F6305" />
    </linearGradient>

    <!-- Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="100%" stop-color="#C69214" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="2.5" />

  <!-- Inner Elegant Border -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="#E6D3A3" stroke-width="0.8" opacity="0.6" />

  <!-- Letter R (Serif Luxury Style) -->
  <text 
    x="31" 
    y="44" 
    font-family="'Playfair Display', 'Cinzel', 'Georgia', 'Times New Roman', serif" 
    font-size="34" 
    font-weight="700" 
    fill="url(#goldLetter)" 
    text-anchor="middle"
    letter-spacing="-0.5"
  >R</text>

  <!-- Little Golden 5-Point Star in Top-Right Corner -->
  <polygon 
    points="47,12 48.5,15.5 52,16 49.5,18.5 50,22 47,20.2 44,22 44.5,18.5 42,16 45.5,15.5" 
    fill="url(#starGlow)" 
  />
</svg>
